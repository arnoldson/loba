# Reusable: start logged out and log in as the E2E author account, ending on
# the map screen. Used by every flow that needs an authenticated session.
appId: com.arnoldson.loba
---
# clearState wipes the stored Supabase session so this always starts logged
# out -- but it also forgets the dev client's Metro URL, hence openLink.
- launchApp:
    clearState: true
- openLink: "com.arnoldson.loba://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
# clearState also resets permissions, and launchApp's `permissions:` didn't
# survive it (iOS values are always|inuse|never, not "allow"), so answer
# the system prompt instead. It hides the app's UI from Maestro until dismissed.
- extendedWaitUntil:
    visible: "Allow While Using App"
    timeout: 60000
    optional: true
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
- extendedWaitUntil:
    visible:
      id: "login-email"
    timeout: 60000
- tapOn:
    id: "login-email"
- inputText: ${E2E_AUTHOR_EMAIL}
- tapOn:
    id: "login-password"
- inputText: ${E2E_AUTHOR_PASSWORD}
- tapOn:
    id: "login-submit"
# iOS offers to save the password after a successful login; that system
# dialog hides the app's UI from Maestro until dismissed.
- extendedWaitUntil:
    visible: "Not Now"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "map-screen"
    timeout: 20000
