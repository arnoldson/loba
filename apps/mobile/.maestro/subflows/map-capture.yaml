# Reusable (#93): wait for the map's next fetch to land, then capture the
# E2E readout (components/E2EMapState.tsx) as output.<NAME> and check its cell
# sizes (scripts/map-state.js). Parameters (via runFlow's `env:`): NAME.
appId: com.arnoldson.loba
---
# The readout starts with "n=<fetch count>", so it stops matching the last
# captured count once a new fetch has landed.
- extendedWaitUntil:
    notVisible:
      id: "e2e-map-state"
      text: "n=${output.lastN} .*"
    timeout: 20000
- copyTextFrom:
    id: "e2e-map-state"
- runScript:
    file: ../scripts/map-state.js
    env:
      ACTION: capture
      NAME: ${NAME}
# The map screen drops a fetch that starts within 1s of the previous one, so
# leave a gap before the next gesture. (Nothing ever shows this text; the wait
# is just a pause.)
- extendedWaitUntil:
    visible: "e2e-pause-never-shown"
    timeout: 1500
    optional: true
