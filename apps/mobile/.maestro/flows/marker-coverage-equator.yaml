# Marker coverage at the equator, open water in the Gulf of Guinea: at every zoom level from street level out to
# near the zoom-out lock, every seeded post on screen has a marker -- no
# strips, sides or corners left unrendered. See subflows/marker-coverage.yaml.
#
# Touches real data: several hundred seeded posts, removed by cleanup-posts.js
# via onFlowComplete.
appId: com.arnoldson.loba
onFlowComplete:
  - runScript: ../scripts/cleanup-posts.js
---
- runFlow:
    file: ../subflows/marker-coverage.yaml
    env:
      CENTER_LAT: "0.001"
      CENTER_LNG: "2.5"
