# Auth login flow (#30, phase 2). The steps live in a subflow so the other
# flows can reuse them; this flow is just "logging in works".
appId: com.arnoldson.loba
---
- runFlow:
    file: ../subflows/login.yaml
    env:
      LOGIN_EMAIL: ${E2E_AUTHOR_EMAIL}
      LOGIN_PASSWORD: ${E2E_AUTHOR_PASSWORD}
