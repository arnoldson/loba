name: Dev Route Safety Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-dev-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for backend/route-check changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'apps/backend/**'
              - 'scripts/**'

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.backend == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.filter.outputs.backend == 'true'
        run: npm ci --workspace=@loba/backend

      - name: Route safety check
        if: steps.filter.outputs.backend == 'true'
        working-directory: apps/backend
        run: node ../../scripts/check-routes.mjs
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.CI_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CI_SUPABASE_SERVICE_ROLE_KEY }}
