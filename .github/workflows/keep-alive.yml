# .github/workflows/keep-alive.yml
name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */12 * * *" # Every 12 hours
  workflow_dispatch: # Manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Keep-alive via insert + delete
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          -- Dedicated, app-unrelated table so this never touches real data.
          -- Keep this out of your ORM's schema/migrations on purpose, so
          -- migrate/push tooling never tries to manage or drop it.
          CREATE TABLE IF NOT EXISTS _keepalive_ping (
            id SERIAL PRIMARY KEY,
            pinged_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );

          INSERT INTO _keepalive_ping (pinged_at) VALUES (now());

          -- Keep the table from growing forever; also gives Supabase a
          -- delete to see, not just an insert.
          DELETE FROM _keepalive_ping WHERE pinged_at < now() - interval '1 day';
          SQL
