<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>

        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,

        padding: 2.5rem 1.5rem 5rem;
        line-height: 1.65;
        color: #1a1a1a;
        background: #ffffff;

  <body>
    <div class="checkmark">✅</div>
    <h1>Email Confirmed</h1>
